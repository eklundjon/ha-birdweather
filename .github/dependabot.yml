version: 2

# Dependency update PRs. Security *alerts* work off the dependency graph and
# don't need this file — this is only about routine version bumps.
#
# Mirrors ha-haikubox's config, minus its aiofiles ignore: this integration
# declares no third-party runtime requirements (it uses Home Assistant's bundled
# aiohttp), so requirements_test.txt holds nothing that mirrors manifest.json.
updates:
  # GitHub Actions used by the workflows in .github/workflows/.
  # Worth having: two of them (hacs/action@main, home-assistant/actions/hassfest@master)
  # deliberately track moving branches per their vendors' documented usage, so
  # this at least keeps the pinned ones (actions/checkout, actions/setup-python)
  # current and visible.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Python test dependencies: requirements_test.txt and requirements_ha_latest.txt.
  #
  # Most entries in requirements_test.txt are deliberately unpinned, so in
  # practice Dependabot bumps two pins: ruff (which the lint job reads straight
  # out of requirements_test.txt, so a bump updates CI in the same PR) and PHACC
  # in requirements_ha_latest.txt, which moves CI's "HA latest" job to each new
  # Home Assistant release. PHACC gets its own group so a Home Assistant bump
  # that breaks something doesn't hold up the ruff bump.
  #
  # Dependabot resolves with the Python in .python-version. Without that file it
  # proposed no PHACC releases needing 3.14 (0.13.368 was skipped). Keep the
  # file at the "HA latest" job's Python in test.yml.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      home-assistant:
        patterns: ["pytest-homeassistant-custom-component"]
      python:
        patterns: ["*"]
