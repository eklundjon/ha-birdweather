name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Install the exact ruff pinned in requirements_test.txt, rather than
      # repeating the version here. That file is the single source of truth, so
      # local and CI cannot drift apart — and a Dependabot bump to it updates CI
      # in the same PR. (When the version lived in both places, a bump to only
      # requirements_test.txt passed CI while silently desyncing the two.)
      - name: Install ruff (version from requirements_test.txt)
        run: |
          pin=$(grep -E '^ruff==' requirements_test.txt)
          if [ -z "$pin" ]; then
            echo "No pinned 'ruff==' line found in requirements_test.txt" >&2
            exit 1
          fi
          echo "Installing $pin"
          pip install "$pin"
      - run: ruff check .

  pytest:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared minimum (hacs.json) and the latest. Each PHACC release
          # pins one exact Home Assistant version, so pinning PHACC pins HA.
          - name: "HA 2025.4 (minimum)"
            phacc: "0.13.236"   # Home Assistant 2025.4.4
          - name: "HA latest"
            phacc: "0.13.316"   # Home Assistant 2026.2.3
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          # Pin PHACC (and therefore Home Assistant) first; requirements_test
          # then adds the integration's runtime deps without upgrading it.
          pip install "pytest-homeassistant-custom-component==${{ matrix.phacc }}"
          pip install -r requirements_test.txt

      - name: Run tests
        # Gate on coverage. The floor sits a couple points below the current
        # ~91%; ratchet it up as coverage grows rather than letting it drift down.
        run: >-
          pytest --cov=custom_components.birdweather --cov-report=term-missing
          --cov-fail-under=88
